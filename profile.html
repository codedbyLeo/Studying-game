<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My profile — StudyQuest</title>
  <meta name="description" content="Your StudyQuest profile, level, badges and study achievements." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;900&family=Nunito:wght@400;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
</head>
<body data-page="profile">
  <div id="toast-region"></div>

  <div class="app-shell">
    <aside class="sidebar">
      <a href="dashboard.html" class="brand">
        <span class="brand-mark"><i data-lucide="book-open"></i></span>
        StudyQuest
      </a>
      <div class="notebook-card side-profile">
        <div class="side-profile-top">
          <div class="avatar avatar-md" data-user-avatar></div>
          <div style="min-width:0;">
            <p style="font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" data-user-name></p>
            <p class="hand text-primary" style="font-size:1.15rem;line-height:1;" data-user-level></p>
          </div>
        </div>
        <div class="progress mt-3"><div data-user-progress></div></div>
        <p class="muted mt-2" style="font-size:.72rem;" data-user-xp-next></p>
        <p class="text-primary mt-1" style="font-size:.72rem;font-weight:700;display:flex;align-items:center;gap:.3rem;">
          <i data-lucide="flame" style="width:.85rem;height:.85rem;"></i> <span data-user-streak></span>
        </p>
      </div>
      <nav class="side-nav">
        <a href="dashboard.html" data-nav-link="dashboard"><i data-lucide="book-open"></i>Desk</a>
        <a href="timer.html" data-nav-link="timer"><i data-lucide="timer"></i>Timer</a>
        <a href="subjects.html" data-nav-link="subjects"><i data-lucide="library"></i>Subjects</a>
        <a href="stats.html" data-nav-link="stats"><i data-lucide="bar-chart-3"></i>Stats</a>
        <a href="history.html" data-nav-link="history"><i data-lucide="history"></i>History</a>
        <a href="leaderboard.html" data-nav-link="leaderboard"><i data-lucide="trophy"></i>Ranks</a>
        <a href="profile.html" data-nav-link="profile"><i data-lucide="user-round"></i>Profile</a>
      </nav>
      <button class="btn btn-ghost" style="margin-top:auto;justify-content:flex-start;" data-sign-out>
        <i data-lucide="log-out"></i> Sign out
      </button>
    </aside>

    <div class="main-col">
      <header class="mobile-header">
        <div class="avatar avatar-sm" data-user-avatar></div>
        <div style="min-width:0;flex:1;">
          <p style="font-size:.85rem;font-weight:800;" data-user-level></p>
          <div class="progress progress-thin mt-1"><div data-user-progress></div></div>
        </div>
        <button class="btn btn-ghost btn-icon" data-sign-out aria-label="Sign out"><i data-lucide="log-out"></i></button>
      </header>

      <main class="page">
        <header class="page-header">
          <div>
            <p class="hand text-primary" style="font-size:1.25rem;">Your student card</p>
            <h1>Profile</h1>
          </div>
        </header>

        <div class="grid" style="gap:1rem;" id="profile-grid">
          <div class="notebook-card card" style="text-align:center;">
            <div class="avatar avatar-lg" style="margin:0 auto;" data-user-avatar></div>
            <h2 class="mt-3" style="font-size:1.5rem;" data-user-name></h2>
            <p class="hand text-primary" style="font-size:1.2rem;" id="p-level-title"></p>
            <p class="muted mt-2" style="font-size:.85rem;" id="p-bio"></p>
            <div class="progress mt-4"><div data-user-progress></div></div>
            <p class="muted mt-2" style="font-size:.72rem;" id="p-progress-text"></p>

            <div class="stat-grid mt-4" id="p-stat-grid" style="text-align:left;"></div>
          </div>

          <div class="flex" style="flex-direction:column;gap:1rem;">
            <div class="notebook-card card">
              <div class="flex items-center justify-between gap-3">
                <h2 class="card-title" style="margin-bottom:0;">Achievements</h2>
                <button type="button" class="btn btn-ghost" id="ach-toggle">Show all badges</button>
              </div>
              <p class="muted mt-2" id="ach-count" style="font-size:.75rem;"></p>
              <div class="ach-grid mt-3" id="ach-grid"></div>
            </div>

            <div class="notebook-card card profile-editor">
              <div class="profile-editor-heading">
                <div>
                  <p class="hand text-primary" style="font-size:1.1rem;">Make it yours</p>
                  <h2 class="card-title" style="margin-bottom:0;">Edit profile</h2>
                </div>
                <span class="profile-edit-icon"><i data-lucide="sparkles"></i></span>
              </div>

              <form id="profile-form">
                <div class="profile-avatar-editor">
                  <div class="avatar avatar-lg" id="pf-avatar-preview"></div>
                  <div>
                    <label class="field-label" for="pf-avatar-file">Profile photo</label>
                    <input id="pf-avatar-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
                    <button type="button" class="btn btn-secondary" id="pf-avatar-btn">
                      <i data-lucide="image-plus"></i> Choose from files
                    </button>
                    <p class="muted mt-2" style="font-size:.72rem;">Choose a photo and adjust the framing.</p>
                  </div>
                </div>

                <div class="field">
                  <label for="pf-username">Username</label>
                  <input id="pf-username" maxlength="24" autocomplete="username" />
                </div>
                <div class="field">
                  <label for="pf-bio">Short bio <span class="muted" id="pf-bio-count">0/300</span></label>
                  <textarea id="pf-bio" rows="3" maxlength="300" placeholder="Year 11 · aiming for straight A's"></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-lg">
                  <i data-lucide="save"></i> Save changes
                </button>
              </form>
            </div>
          </div>
        </div>

      </main>

      <div class="modal-overlay" id="avatar-crop-modal" aria-hidden="true">
        <div class="notebook-card modal-box avatar-crop-box" role="dialog" aria-modal="true" aria-labelledby="avatar-crop-title">
          <div class="flex items-center justify-between gap-3">
            <div>
              <p class="hand text-primary" style="font-size:1.05rem;">Almost there</p>
              <h2 id="avatar-crop-title" style="margin-bottom:0;">Crop your profile photo</h2>
            </div>
            <button type="button" class="btn btn-ghost btn-icon" id="avatar-crop-cancel" aria-label="Close"><i data-lucide="x"></i></button>
          </div>

          <div class="crop-stage" id="crop-stage">
            <img id="crop-image" alt="Crop preview" draggable="false" />
            <div class="crop-window" aria-hidden="true"></div>
          </div>

          <div class="crop-controls">
            <button type="button" class="btn btn-ghost btn-icon" id="crop-zoom-out" aria-label="Zoom out"><i data-lucide="minus"></i></button>
            <input id="crop-zoom" type="range" min="1" max="3" step=".01" value="1" aria-label="Zoom" />
            <button type="button" class="btn btn-ghost btn-icon" id="crop-zoom-in" aria-label="Zoom in"><i data-lucide="plus"></i></button>
          </div>

          <p class="muted crop-hint"><i data-lucide="move"></i> Drag the photo to position it</p>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" id="avatar-crop-cancel-2">Cancel</button>
            <button type="button" class="btn btn-primary" id="avatar-crop-save"><i data-lucide="check"></i> Use photo</button>
          </div>
        </div>
      </div>

      <nav class="bottom-nav">
        <a href="dashboard.html" data-nav-link="dashboard"><i data-lucide="book-open"></i>Desk</a>
        <a href="timer.html" data-nav-link="timer"><i data-lucide="timer"></i>Timer</a>
        <a href="subjects.html" data-nav-link="subjects"><i data-lucide="library"></i>Subjects</a>
        <a href="stats.html" data-nav-link="stats"><i data-lucide="bar-chart-3"></i>Stats</a>
        <a href="history.html" data-nav-link="history"><i data-lucide="history"></i>History</a>
        <a href="leaderboard.html" data-nav-link="leaderboard"><i data-lucide="trophy"></i>Ranks</a>
        <a href="profile.html" data-nav-link="profile"><i data-lucide="user-round"></i>Profile</a>
      </nav>
    </div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
